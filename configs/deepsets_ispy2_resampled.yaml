# DeepSets — ISPY2, resampled vessel segmentation centerlines.
#
# Identical to deepsets_ispy2.yaml in every modeling parameter.
# Only data_paths differ: centerline_root and tumor_mask_root point at
# the resampled centerlines and resampled tumor masks on this cluster.
#
# Purpose: compare DeepSets AUC on native vs resampled data using the
# same model architecture, to assess whether resampling improves or
# degrades the vessel graph signal for pCR prediction.

feature_toggles:
  dataset_include: ["ISPY2"]
  tumor_mask_file_pattern: "{case_id}.nii.gz"

experiment_setup:
  name: "deepsets_ispy2_resampled"
  base_outdir: "/ess/scratch/scratch1/t-9sbose/vanguard_experiments"

model_params:
  device: "cpu"
  n_splits: 5
  batch_size: 8
  epochs: 40
  hidden_dim: 64
  num_layers: 2
  dropout: 0.2
  learning_rate: 0.001
  weight_decay: 0.0001
  pooling: "mean_max_logcount"
  deepsets_local_radius_floor_mm: 50.0
  deepsets_local_radius_scale: 2.0
  deepsets_local_radius_cap_mm: 60.0
  deepsets_inclusion_rule: "local_radius_with_fallback"
  deepsets_compare_inclusion_rules: []
  deepsets_point_feature_set: "baseline"

data_paths:
  centerline_root: "/gpfs/data/karczmar-lab/workspaces/saritbose/resamples_centerlines_tc4d"
  tumor_mask_root: "/gpfs/data/karczmar-lab/workspaces/saritbose/resampled-tumor-masks"
  patient_info_dir: "/ess/scratch/scratch1/annawoodard/MAMA-MIA-syn60868042/patient_info_files"
  clinical_excel: "/ess/scratch/scratch1/annawoodard/MAMA-MIA-syn60868042/clinical_and_imaging_info.xlsx"
  labels_csv: "/ess/scratch/scratch1/t-9sbose/pcr_labels.csv"
  label_column: "pcr"
  id_column: "case_id"
  deepsets_manifest_csv: ""
  deepsets_label_column: "label"
  vessel_segmentation_root: ""
