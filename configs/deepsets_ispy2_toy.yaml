feature_toggles:
  dataset_include: ["ISPY2"]
  toy_perfect_feature: true
  toy_only: true

experiment_setup:
  name: "deepsets_ispy2_toy_perfect"
  base_outdir: "./experiments"

model_params:
  device: "cpu"
  n_splits: 5
  batch_size: 8
  epochs: 40
  hidden_dim: 64
  num_layers: 2
  dropout: 0.2
  learning_rate: 0.001
  weight_decay: 0.0001
  pooling: "mean_max_logcount"
  deepsets_local_radius_floor_mm: 50.0
  deepsets_local_radius_scale: 2.0
  deepsets_local_radius_cap_mm: 60.0

data_paths:
  centerline_root: "/net/projects2/vanguard/centerlines_tc4d/studies"
  tumor_mask_root: "/gpfs/data/karczmar-lab/MAMA-MIA-syn60868042/segmentations/expert"
  patient_info_dir: "/gpfs/data/karczmar-lab/MAMA-MIA-syn60868042/patient_info_files"
  clinical_excel: "/gpfs/data/karczmar-lab/MAMA-MIA-syn60868042/clinical_and_imaging_info.xlsx"
  labels_csv: "/gpfs/data/karczmar-lab/MAMA-MIA-syn60868042/pcr_labels.csv"
  label_column: "pcr"
  id_column: "case_id"
  deepsets_manifest_csv: ""
  deepsets_label_column: "label"

# Dataset-adapter selection (multi-dataset migration Step 5: required on every
# run). This config's dataset_include already scopes rows to ISPY2, but that
# filtering happens in feature_toggles, not via this adapter's cohort filter
# -- tabular/cohort.py's feature build never calls adapter.discover_cases(),
# so cohort here only needs to be a *valid* MAMA-MIA cohort, not necessarily
# ISPY2 (see modularization-status.md item 5, open with Anna). Set to match
# dataset_include for clarity.
dataset:
  name: mamamia
  cohort: ispy2
  root: /gpfs/data/karczmar-lab/MAMA-MIA-syn60868042
