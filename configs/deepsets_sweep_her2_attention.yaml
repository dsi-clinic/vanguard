# Phase 2a: Attention-pooling sweep on the full ISPY2 cohort (n=980).
#
# 6 variants = {attention, attention_logcount} x {16, 32, 64} attention_hidden_dim.
# Base hyperparams reuse the Phase 3 winner h256_d02_lfocal so the only changing
# axis vs the prior best is the pooling operation. Submit only after Phase 0e
# confirms the architecture-bottleneck story (XGB on n=68 intersection holds at
# ~0.67). If Phase 0e drops to ~0.60, do not submit this; the project pivots to
# a cohort-size story instead.

sweep_name: "deepsets_sweep_her2_attention_full"
base_config: "configs/deepsets_ispy2_pointfeat_geom_topo_dynamic.yaml"

shared_overrides:
  epochs: 80
  early_stopping_patience: 8
  restore_best_epoch: true
  lr_scheduler: "plateau"
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 4
  max_grad_norm: 1.0
  num_layers: 2
  hidden_dim: 256
  dropout: 0.2
  weight_decay: 0.0001
  loss: "focal"
  focal_alpha: 0.25
  focal_gamma: 2.0
  random_state: 42

variants:
  - { id: "attn_h16",         pooling: "attention",          attention_hidden_dim: 16 }
  - { id: "attn_h32",         pooling: "attention",          attention_hidden_dim: 32 }
  - { id: "attn_h64",         pooling: "attention",          attention_hidden_dim: 64 }
  - { id: "attn_logn_h16",    pooling: "attention_logcount", attention_hidden_dim: 16 }
  - { id: "attn_logn_h32",    pooling: "attention_logcount", attention_hidden_dim: 32 }
  - { id: "attn_logn_h64",    pooling: "attention_logcount", attention_hidden_dim: 64 }
