# JUNCTION arm of the matched graph-representation comparison (v1).
# node_mode="junction": junction/endpoint voxels are nodes, each vessel segment
# is an edge (segment-as-edge, Option A). See gnn/DESIGN_segment_graph.md and
# experiments/graph_repr_compare_v1/README.md.
#
# Matched arm: same cohort/folds and the same 6 underlying signals, split across
# the representation's two carriers -- the per-voxel signals sit on the junction
# NODES (identical names to the voxel arm), and the segment summary sits on the
# segment EDGES (seg_*_mean, identical to the segment arm's node features). This
# is the honest topological dual of the segment (line-graph) representation.
# TTE no-arrival is sentinel-filled (-1.0) on both nodes and edges, same policy
# as every arm (see gnn/data_loader.TTE_NO_ARRIVAL_SENTINEL).
#
# Folds frozen up front from pcr_labels_folded.csv (see gnn.make_fold_assignments).
# Build the matching cache first (build + train must use the SAME folded labels):
#   python -m gnn.build_dataset --node-mode junction \
#       --labels-path <workspace>/pcr_labels_folded.csv \
#       --cache-dir <workspace>/gnn_cache_junction_compare \
#       --node-features peak_time,peak_enhancement,time_to_enhancement,washin_slope,auc_positive,radius \
#       --edge-features seg_peak_time_mean,seg_peak_enhancement_mean,seg_time_to_enhancement_mean,seg_washin_slope_mean,seg_auc_positive_mean,seg_radius_mean
# NOTE: /gpfs quota is exhausted; actual runs use scratch override configs.

experiment_setup:
  name: "gnn_junction_compare"
  base_outdir: "./experiments"

model_params:
  device: "cpu"
  n_splits: 5
  random_state: 42
  use_group_split: false
  group_col: "site"
  stratum_col: "dataset"
  split_mode: "predefined"
  split_col: "fold"
  batch_size: 8
  epochs: 25
  hidden_dim: 32
  num_layers: 2
  dropout: 0.2
  learning_rate: 0.001
  gnn_node_mode: "junction"
  gnn_node_features:
    - "peak_time"
    - "peak_enhancement"
    - "time_to_enhancement"
    - "washin_slope"
    - "auc_positive"
    - "radius"
  gnn_edge_features:
    - "seg_peak_time_mean"
    - "seg_peak_enhancement_mean"
    - "seg_time_to_enhancement_mean"
    - "seg_washin_slope_mean"
    - "seg_auc_positive_mean"
    - "seg_radius_mean"

data_paths:
  gnn_centerline_root: "/gpfs/data/karczmar-lab/workspaces/saritbose/centerlines_tc4d/studies"
  gnn_dce_root: "/gpfs/data/karczmar-lab/MAMA-MIA-syn60868042/images"
  gnn_labels_path: "/gpfs/data/karczmar-lab/workspaces/spencervenancio/pcr_labels_folded.csv"
  gnn_cache_dir: "/gpfs/data/karczmar-lab/workspaces/spencervenancio/gnn_cache_junction_compare"
  gnn_id_column: "case_id"
  gnn_label_column: "pcr"
  gnn_cases: null
  gnn_dataset_include: null
