# Smoke-test config for GNN graph-level clinical covariates (gnn.clinical,
# data.graph_features), segment mode. Exercises the full loader -> per-fold
# standardization -> graph_dim > 0 model concat path end-to-end on an 8-case
# cache. Results are NOT meaningful (n=8, one positive case).
#
# Build the matching cache first (see gnn/slurm/submit_gnn_build.slurm,
# GRAPH_FEATURES/PATIENT_INFO_DIR env vars) -- this config expects
# gnn_cache_segment_smoke_graph_features to already exist.

experiment_setup:
  name: "gnn_segment_smoke_graph_features"
  base_outdir: "./experiments"

model_params:
  device: "cpu"
  n_splits: 2
  random_state: 0
  use_group_split: false
  group_col: "site"
  stratum_col: "dataset"
  split_mode: "random"
  split_col: "fold"
  batch_size: 4
  epochs: 3
  hidden_dim: 32
  num_layers: 2
  dropout: 0.2
  learning_rate: 0.001
  gnn_node_mode: "segment"
  gnn_node_features:
    - "seg_peak_time_mean"
    - "seg_radius_mean"
  gnn_graph_features:
    - "age"
    - "menopausal_status"
    - "tumor_subtype"

data_paths:
  gnn_centerline_root: "/gpfs/data/karczmar-lab/workspaces/saritbose/centerlines_tc4d/studies"
  gnn_dce_root: "/gpfs/data/karczmar-lab/MAMA-MIA-syn60868042/images"
  gnn_labels_path: "/gpfs/data/karczmar-lab/workspaces/saritbose/pcr_labels.csv"
  gnn_cache_dir: "/gpfs/data/karczmar-lab/workspaces/spencervenancio/gnn_cache_segment_smoke_graph_features"
  gnn_id_column: "case_id"
  gnn_label_column: "pcr"
  gnn_cases: ["DUKE_001", "DUKE_002", "ISPY1_1001", "ISPY1_1002", "ISPY2_100899", "ISPY2_102011", "NACT_01", "NACT_02"]
  gnn_dataset_include: null
  gnn_patient_info_dir: "/gpfs/data/karczmar-lab/MAMA-MIA-syn60868042/patient_info_files"
