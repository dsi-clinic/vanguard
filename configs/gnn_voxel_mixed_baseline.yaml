# Arm 1 (mixed baseline) of the harmonized single-breast dataset minimal
# experiment -- see LAB_NOTEBOOK.md 2026-07-14 and AUDITING_RESULTS.md for
# the full plan. Voxel mode only (node_mode="voxel"), current behavior:
# bilateral cases keep their exam-level (both-breast) skeleton.
#
# Matched against gnn_voxel_single_breast.yaml (arm 2): identical features,
# identical hyperparameters, identical frozen folds, and -- critically --
# the identical case-ID cohort. Arm 2 necessarily drops any bilateral case
# the breast-splitter excludes (unknown tumor side, missing tumor mask,
# tumor straddling both sides -- see gnn/build_single_breast_skeletons.py's
# breast_split_manifest.csv), so this arm's labels file is *already*
# restricted to the same matched cohort (pcr_labels_folded_matched_cohort.csv,
# built by intersecting the frozen fold assignment with
# breast_split_manifest.csv's included cases + all native-unilateral cases)
# -- not the full labeled cohort -- so the two arms are matched by
# construction rather than needing a separate case whitelist.
#
# Build:
#   python -m gnn.build_dataset --node-mode voxel \
#       --labels-path <scratch>/pcr_labels_folded_matched_cohort.csv \
#       --cache-dir <scratch>/gnn_cache_voxel_mixed_baseline \
#       --node-features peak_time,peak_enhancement,time_to_enhancement,washin_slope,auc_positive,radius

experiment_setup:
  name: "gnn_voxel_mixed_baseline"
  base_outdir: "./experiments"

model_params:
  device: "cpu"
  n_splits: 5
  random_state: 42
  use_group_split: false
  group_col: "site"
  stratum_col: "dataset"
  split_mode: "predefined"
  split_col: "fold"
  batch_size: 8
  epochs: 25
  hidden_dim: 32
  num_layers: 2
  dropout: 0.2
  learning_rate: 0.001
  gnn_node_mode: "voxel"
  gnn_node_features:
    - "peak_time"
    - "peak_enhancement"
    - "time_to_enhancement"
    - "washin_slope"
    - "auc_positive"
    - "radius"
  gnn_breast_split_mode: null

data_paths:
  gnn_centerline_root: "/gpfs/data/karczmar-lab/workspaces/saritbose/centerlines_tc4d/studies"
  gnn_dce_root: "/gpfs/data/karczmar-lab/MAMA-MIA-syn60868042/images"
  gnn_labels_path: "/ess/scratch/scratch1/t-9svena/gnn_caches/pcr_labels_folded_matched_cohort.csv"
  gnn_cache_dir: "/ess/scratch/scratch1/t-9svena/gnn_cache_voxel_mixed_baseline"
  gnn_id_column: "case_id"
  gnn_label_column: "pcr"
  gnn_cases: null
  gnn_dataset_include: null
