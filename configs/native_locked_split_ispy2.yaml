# Independent-signal matrix — NATIVE centerlines, LOCKED SPLIT.
#
# PURPOSE
# -------
# This config runs the exact same 6-arm ablation as the resampled run
# (independent_signal_randi_resampled.yaml) but on NATIVE-spacing centerlines,
# with the train/test fold assignment locked to whatever the resampled run used.
#
# WHY LOCKED SPLIT
# ----------------
# The mentor identified that the resampled vs. Q3 baseline comparison confounds
# three variables: (1) train/test split, (2) code version, (3) resampling.
# By locking the split, the resampled run and this native run differ ONLY in the
# centerline source. Any AUC delta is therefore attributable to resampling alone.
#
# HOW IT WORKS
# ------------
# data_paths.fixed_splits_csv points to a CSV with columns case_id, val_fold.
# That CSV was extracted from the resampled run's predictions by running:
#   python scripts/extract_resampled_splits.py
# The split-building code in evaluation/build_splits.py reads this CSV instead
# of generating new splits, so fold assignments are identical across both runs.
#
# PREREQUISITES
# -------------
# 1. Resampled run must be complete:
#      /ess/scratch/scratch1/t-9sbose/vanguard_experiments/
#      independent_signal_resampled_ispy2/runs/*/predictions.csv
# 2. Locked split CSV must exist (run extract_resampled_splits.py first):
#      /ess/scratch/scratch1/t-9sbose/vanguard_experiments/
#      locked_split_resampled_ispy2.csv
#
# OUTPUTS
# -------
# /ess/scratch/scratch1/t-9sbose/vanguard_experiments/
# independent_signal_native_locked_ispy2/ablation_summary.csv
#
# COMPARISON SCRIPT
# -----------------
# After this run completes, generate the side-by-side table with:
#   micromamba run -n vanguard python scripts/compare_locked_split_auc.py

baseline_arm_name: "clinical_plus_tumor_size"

feature_toggles:
  use_vascular: true
  use_morphometry: true
  require_centerline_file: true
  include_missing_centerline_rows: false
  use_clinical: true
  include_site_features: false
  dataset_include: ["ISPY2"]
  bilateral_filter: false
  use_tumor_local_features: true
  use_tumor_graph_features_json: true
  tumor_mask_file_pattern: "{case_id}.nii.gz"
  tumor_mask_threshold: 0.5
  tumor_radius_voxels: [0, 2, 4, 8]
  use_radiomics: false
  merge_how: "inner"
  selected_features: null

experiment_setup:
  name: "tc4d_independent_signal_matrix_ispy2_native_locked"
  base_outdir: "/ess/scratch/scratch1/t-9sbose/vanguard_experiments"

model_params:
  model: "lr"
  penalty: "elasticnet"
  solver: "saga"
  l1_ratio: 0.5
  C: 1.0
  n_splits: 5
  random_state: 42
  max_iter: 5000
  feature_select_enabled: true
  feature_select_mode: "global_topk"
  feature_select_k: 64
  feature_select_k_kin: 16
  feature_select_kin_method: "mrmr"
  feature_select_kinematic_prefixes: ["kinematic_"]
  feature_select_max_abs_corr: 0.95
  feature_select_max_zero_rate: 0.95
  feature_select_min_non_na_rate: 0.2
  feature_select_min_n_unique: 2
  feature_select_mrmr_redundancy_weight: 1.0
  feature_select_mrmr_include_baseline: true
  feature_select_corr_gate_against_baseline: true
  nested_tune_enabled: true
  nested_inner_splits: 3
  nested_c_grid: [0.5, 1.0, 2.0]
  nested_l1_ratio_grid: [0.25, 0.5, 0.75]
  nested_feature_select_mode_grid: ["global_topk"]
  nested_k_kin_grid: [0, 8, 16, 32]
  nested_kin_method_grid: ["topk_auc", "mrmr"]
  nested_max_abs_corr_grid: [0.9, 0.95]
  nested_max_zero_rate_grid: [0.9, 0.95]
  n_estimators: 300
  max_depth: null
  min_samples_leaf: 1
  use_group_split: false
  group_col: "site"
  stratum_col: "tumor_subtype"

data_paths:
  # NATIVE centerlines (cohort dirs live under studies/).
  centerline_root: "/gpfs/data/karczmar-lab/workspaces/saritbose/centerlines_tc4d/studies"
  # Native expert tumor masks at native voxel spacing.
  tumor_mask_root: "/ess/scratch/scratch1/annawoodard/MAMA-MIA-syn60868042/segmentations/expert"
  patient_info_dir: "/ess/scratch/scratch1/annawoodard/MAMA-MIA-syn60868042/patient_info_files"
  clinical_excel: "/ess/scratch/scratch1/annawoodard/MAMA-MIA-syn60868042/clinical_and_imaging_info.xlsx"
  labels_csv: "/ess/scratch/scratch1/t-9sbose/pcr_labels.csv"
  label_column: "pcr"
  id_column: "case_id"
  radiomics_csv: ""
  # Locked split: fold assignment extracted from the completed resampled run.
  # Generated by: python scripts/extract_resampled_splits.py
  fixed_splits_csv: "/ess/scratch/scratch1/t-9sbose/vanguard_experiments/locked_split_resampled_ispy2.csv"

ablation_arms:
  - name: "clinical_plus_tumor_size"
    selected_features: ["clinical", "tumor_size"]

  - name: "clinical_plus_tumor_size_plus_morph"
    selected_features: ["clinical", "tumor_size", "morph"]

  - name: "clinical_plus_tumor_size_plus_graph"
    selected_features: ["clinical", "tumor_size", "graph"]

  - name: "clinical_plus_tumor_size_plus_kinematic"
    selected_features: ["clinical", "tumor_size", "kinematic"]
    model_params_override:
      feature_select_mode: "block_kinematic"
      nested_feature_select_mode_grid: ["block_kinematic"]
      feature_select_k_kin: 16
      nested_k_kin_grid: [0, 8, 16, 32]
      feature_select_kin_method: "mrmr"
      nested_kin_method_grid: ["topk_auc", "mrmr"]

  - name: "clinical_plus_tumor_size_plus_graph_plus_kinematic"
    selected_features: ["clinical", "tumor_size", "graph", "kinematic"]
    model_params_override:
      feature_select_mode: "block_kinematic"
      nested_feature_select_mode_grid: ["block_kinematic"]
      feature_select_k_kin: 16
      nested_k_kin_grid: [0, 8, 16, 32]
      feature_select_kin_method: "mrmr"
      nested_kin_method_grid: ["topk_auc", "mrmr"]

  - name: "clinical_plus_tumor_size_plus_vessel_all"
    selected_features: ["clinical", "tumor_size", "morph", "graph", "kinematic"]
    model_params_override:
      feature_select_mode: "block_kinematic"
      nested_feature_select_mode_grid: ["block_kinematic"]
      feature_select_k_kin: 16
      nested_k_kin_grid: [0, 8, 16, 32]
      feature_select_kin_method: "mrmr"
      nested_kin_method_grid: ["topk_auc", "mrmr"]
