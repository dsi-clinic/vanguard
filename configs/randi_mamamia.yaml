# Config for running the full MAMA-MIA PCR prediction pipeline on randi (CRI cluster).
# All /net/ paths from the original DSI configs are replaced with /ess/scratch/scratch1/ paths.
# dataset_include is null to include all MAMA-MIA cohorts (DUKE, ISPY1, ISPY2, NACT).
feature_toggles:
  use_vascular: true
  use_morphometry: true
  require_centerline_file: true
  include_missing_centerline_rows: false
  use_clinical: true
  include_site_features: false
  dataset_include: null
  bilateral_filter: null
  use_tumor_local_features: true
  use_tumor_graph_features_json: true
  tumor_mask_file_pattern: "{case_id}.nii.gz"
  tumor_mask_threshold: 0.5
  tumor_radius_voxels: [0, 2, 4, 8]
  use_radiomics: false
  merge_how: "inner"

experiment_setup:
  name: "randi_mamamia_run1"
  base_outdir: "/ess/scratch/scratch1/t-9sbose/vanguard_experiments"

model_params:
  model: "lr"
  penalty: "elasticnet"
  solver: "saga"
  l1_ratio: 0.5
  C: 1.0
  n_splits: 5
  random_state: 42
  max_iter: 3000
  feature_select_enabled: false
  feature_select_mode: "global_topk"
  feature_select_k: 128
  feature_select_k_kin: 0
  feature_select_kin_method: "topk_auc"
  feature_select_kinematic_prefixes: ["kinematic_"]
  feature_select_max_abs_corr: null
  feature_select_max_zero_rate: null
  feature_select_min_non_na_rate: 0.2
  feature_select_min_n_unique: 2
  feature_select_mrmr_redundancy_weight: 1.0
  feature_select_mrmr_include_baseline: true
  feature_select_corr_gate_against_baseline: true
  nested_tune_enabled: false
  nested_inner_splits: 3
  nested_c_grid: [1.0]
  nested_l1_ratio_grid: [0.5]
  nested_feature_select_mode_grid: ["block_kinematic"]
  nested_k_kin_grid: [0, 16, 32, 64]
  nested_kin_method_grid: ["topk_auc", "mrmr"]
  nested_max_abs_corr_grid: [0.95]
  nested_max_zero_rate_grid: [0.95]
  n_estimators: 300
  max_depth: null
  min_samples_leaf: 1
  use_group_split: false
  group_col: "site"
  stratum_col: "tumor_subtype"

data_paths:
  vessel_segmentation_root: "/ess/scratch/scratch1/t-9sbose/vessel_segmentations"
  centerline_root: "/ess/scratch/scratch1/t-9sbose/centerlines_tc4d/studies"
  tumor_mask_root: "/ess/scratch/scratch1/annawoodard/MAMA-MIA-syn60868042/segmentations/expert"
  patient_info_dir: "/ess/scratch/scratch1/annawoodard/MAMA-MIA-syn60868042/patient_info_files"
  clinical_excel:   "/ess/scratch/scratch1/annawoodard/MAMA-MIA-syn60868042/clinical_and_imaging_info.xlsx"
  labels_csv:       "/ess/scratch/scratch1/t-9sbose/pcr_labels.csv"
  label_column: "pcr"
  id_column: "case_id"
  radiomics_csv: ""
