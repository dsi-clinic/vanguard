# UChicago tier ladder -- BASELINE arm, on the CLEANED PRETREATMENT cohort.
#
# Identical to configs/uchicago_gnn_tier_baseline_floored.yaml in every model
# knob; the only differences are the labels file and the cache it reads. This is
# deliberate: the whole point is an apples-to-apples re-estimate of the same
# model on a cleaner cohort, so anything else changing would confound the
# comparison.
#
# Cohort: /gpfs/data/karczmar-lab/vanguard/dce2d_internal_ultrafast_pretreatment_cohort_v1
# (83 exams / 83 patients, one exam per patient, 50 non-pCR / 33 pCR). It is a
# strict subset of the legacy 181-exam manifest: the 98 dropped rows are
# non-pretreatment (longitudinal follow-up) exams, which is why the legacy set
# had more images than patients. Folds, labels, and the first 37 manifest
# columns are preserved exactly from the legacy manifest.
#
# Effective N is 82, not 83: exam uch_nac_1_3_9789...5840 has no v5 centerline
# (its DCE is split across 8 HR series with no UFAST, so the paired
# preprocessing pipeline could not run it -- it is listed in the cohort's own
# paired_preprocessing_exclusions.csv).
#
# The cache is built with an explicit --cases whitelist of the 83 cohort exam
# ids, NOT by pointing the builder at the centerline root and letting the
# unwanted cases fall out as "missing label". That distinction is deliberate:
# the centerline root still holds all 179 legacy exams, so the permissive route
# drops 54% of what it discovers and (correctly) trips the builder's
# max_missing_label_frac guard. Raising that threshold to 0.55 would disable a
# real safety check for every future run against this cache; whitelisting states
# the intent instead and leaves the guard armed at its default.
#
# Consequence to be aware of when auditing: because the whitelist filters at
# DISCOVERY, the one centerline-less exam never enters the build and so does NOT
# appear in processed/dropped_cases.json. Its absence is instead visible as
# num_graphs=82 against an 83-row labels file, and is recorded with its manifest
# evidence in the experiment README.

experiment_setup:
  name: "uchicago_gnn_tier_baseline_floored_pretreat"
  base_outdir: "./experiments"

model_params:
  device: "cpu"
  n_splits: 5
  random_state: 42
  use_group_split: false
  # The cohort is one exam per patient, so predefined folds are now also
  # trivially patient-disjoint (they already were -- the legacy folds were
  # patient-grouped). Folds are the manifest's, unchanged.
  split_mode: "predefined"
  split_col: "fold"
  # Declares the cache was built with the kinetics.py baseline floor (0.05);
  # must match the cache manifest's kinetic_baseline_floor_frac.
  gnn_kinetic_baseline_floor_frac: 0.05
  batch_size: 8
  epochs: 25
  hidden_dim: 32
  num_layers: 2
  dropout: 0.2
  learning_rate: 0.001
  gnn_node_features:
    - "peak_time"
    - "peak_enhancement"
    - "time_to_enhancement"
    - "washin_slope"
    - "washout_slope"
    - "auc_positive"
    - "radius"
  # Frozen historical baseline (D0.6): pin to pre-hygiene behavior.
  weight_decay: 0.0
  loss: "unweighted_bce"
  lr_scheduler: "none"
  max_grad_norm: 0.0
  early_stopping_patience: 0
  restore_best_epoch: false
  gnn_pooling: "mean"

data_paths:
  gnn_centerline_root: "/ess/scratch/scratch1/t-9svena/uchicago/preprocessing_out_v5/centerlines"
  gnn_dce_root: "/ess/scratch/scratch1/t-9svena/uchicago/preprocessing_out_v5/dce"
  gnn_labels_path: "/gpfs/data/karczmar-lab/workspaces/spencervenancio/uchicago/uchicago_labels_folded_pretreat_v1.csv"
  gnn_cache_dir: "/ess/scratch/scratch1/t-9svena/uchicago/gnn_cache_voxel_richfeat_floored_pretreat83"
  gnn_id_column: "case_id"
  gnn_label_column: "pcr"
  # The cohort, stated explicitly so the config alone determines the case set
  # and matches the whitelist recorded in the cache manifest. Generated from
  # uchicago_labels_folded_pretreat_v1.csv; 83 ids, of which 82 have a v5
  # centerline and become graphs.
