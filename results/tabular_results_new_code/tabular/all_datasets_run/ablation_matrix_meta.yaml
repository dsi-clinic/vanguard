  explicit_model_columns: null
  model_params_override:
    feature_select_mode: block_kinematic
    nested_feature_select_mode_grid:
    - block_kinematic
    feature_select_k_kin: 16
    nested_k_kin_grid:
    - 0
    - 8
    - 16
    - 32
    feature_select_kin_method: mrmr
    nested_kin_method_grid:
    - topk_auc
    - mrmr
  feature_toggles_override: {}
