baseline_arm_name: clinical_plus_tumor_size
feature_toggles:
  use_vascular: true
  use_morphometry: true
  require_centerline_file: true
  include_missing_centerline_rows: false
  use_clinical: true
  include_site_features: false
  dataset_include:
  - DUKE
  - ISPY1
  - ISPY2
  - NACT
  bilateral_filter: null
  use_tumor_local_features: true
  use_tumor_graph_features_json: true
  tumor_mask_file_pattern: '{case_id}.nii.gz'
  tumor_mask_threshold: 0.5
  tumor_radius_voxels:
  - 0
  - 2
  - 4
  - 8
  use_radiomics: false
  merge_how: inner
  selected_features:
  - clinical
  - tumor_size
  centerline_file_pattern: '{case_id}_skeleton_4d_exam_mask.npy'
  deepsets_support_mask_pattern: '{case_id}_skeleton_4d_exam_support_mask.npy'
  toy_perfect_feature: false
  toy_only: false
experiment_setup:
  name: clinical_plus_tumor_size__xgb__cv
  base_outdir: ./experiments
model_params:
  model: xgb
  penalty: elasticnet
  solver: saga
  l1_ratio: 0.5
  C: 1.0
  n_splits: 5
  random_state: 42
  max_iter: 5000
  feature_select_enabled: true
  feature_select_mode: global_topk
  feature_select_k: 64
  feature_select_k_kin: 16
  feature_select_kin_method: mrmr
  feature_select_kinematic_prefixes:
  - kinematic_
  feature_select_max_abs_corr: 0.95
  feature_select_max_zero_rate: 0.95
  feature_select_min_non_na_rate: 0.2
  feature_select_min_n_unique: 2
  feature_select_mrmr_redundancy_weight: 1.0
  feature_select_mrmr_include_baseline: true
  feature_select_corr_gate_against_baseline: true
  nested_tune_enabled: false
  nested_inner_splits: 3
  nested_inner_random_state: 42
  nested_c_grid:
  - 0.5
  - 1.0
  - 2.0
  nested_l1_ratio_grid:
  - 0.25
  - 0.5
  - 0.75
  nested_feature_select_mode_grid:
  - global_topk
  nested_k_kin_grid:
  - 0
  - 8
  - 16
  - 32
  nested_kin_method_grid:
  - topk_auc
  - mrmr
  nested_max_abs_corr_grid:
  - 0.9
  - 0.95
  nested_max_zero_rate_grid:
  - 0.9
  - 0.95
  n_estimators: 400
  max_depth: null
  min_samples_leaf: 1
  xgb_learning_rate: 0.05
  xgb_subsample: 0.8
  xgb_colsample_bytree: 0.8
  xgb_min_child_weight: 1.0
  xgb_reg_alpha: 0.0
  xgb_reg_lambda: 1.0
  xgb_gamma: 0.0
  use_group_split: false
  group_col: site
  stratum_col: tumor_subtype
  device: auto
  batch_size: 8
  epochs: 25
  hidden_dim: 32
  num_layers: 2
  dropout: 0.2
  learning_rate: 0.001
  weight_decay: 0.0001
  pooling: mean_max_logcount
  early_stopping_patience: 0
  restore_best_epoch: false
  max_grad_norm: 0.0
  lr_scheduler: none
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 5
  use_layer_norm: false
  attention_hidden_dim: 32
  loss: weighted_bce
  focal_alpha: 0.25
  focal_gamma: 2.0
  deepsets_local_radius_floor_mm: 50.0
  deepsets_local_radius_scale: 2.0
  deepsets_local_radius_cap_mm: 60.0
  deepsets_inclusion_rule: local_radius_with_fallback
  deepsets_compare_inclusion_rules: []
  deepsets_point_feature_set: baseline
data_paths:
  centerline_root: /gpfs/data/karczmar-lab/workspaces/saritbose/centerlines_tc4d/studies
  tumor_mask_root: /gpfs/data/karczmar-lab/MAMA-MIA-syn60868042/segmentations/expert
  patient_info_dir: /gpfs/data/karczmar-lab/MAMA-MIA-syn60868042/patient_info_files
  clinical_excel: /gpfs/data/karczmar-lab/MAMA-MIA-syn60868042/clinical_and_imaging_info.xlsx
  labels_csv: /gpfs/data/karczmar-lab/workspaces/saritbose/pcr_labels.csv
  label_column: pcr
  id_column: case_id
  radiomics_csv: ''
  deepsets_manifest_csv: ''
  deepsets_label_column: label
  vessel_segmentation_root: ''
ablation_arms:
- name: clinical_plus_tumor_size
  selected_features:
  - clinical
  - tumor_size
- name: clinical_plus_tumor_size_plus_morph
  selected_features:
  - clinical
  - tumor_size
  - morph
- name: clinical_plus_tumor_size_plus_graph
  selected_features:
  - clinical
  - tumor_size
  - graph
- name: clinical_plus_tumor_size_plus_kinematic
  selected_features:
  - clinical
  - tumor_size
  - kinematic
  model_params_override:
    feature_select_mode: block_kinematic
    nested_feature_select_mode_grid:
    - block_kinematic
    feature_select_k_kin: 16
    nested_k_kin_grid:
    - 0
    - 8
    - 16
    - 32
    feature_select_kin_method: mrmr
    nested_kin_method_grid:
    - topk_auc
    - mrmr
- name: clinical_plus_tumor_size_plus_vessel_all
  selected_features:
  - clinical
  - tumor_size
  - morph
  - graph
  - kinematic
  model_params_override:
    feature_select_mode: block_kinematic
    nested_feature_select_mode_grid:
    - block_kinematic
    feature_select_k_kin: 16
    nested_k_kin_grid:
    - 0
    - 8
    - 16
    - 32
    feature_select_kin_method: mrmr
    nested_kin_method_grid:
    - topk_auc
    - mrmr
model_families:
- lr
- xgb
split_mode_matrix:
- name: cv
  use_group_split: false
model_family_overrides:
  lr:
    nested_tune_enabled: true
  xgb:
    nested_tune_enabled: false
baseline_run_name: clinical_plus_tumor_size__lr__cv
export_subtype_summary: false
top_features_eval: null
